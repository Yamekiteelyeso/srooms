# ================================================================
# SRooms 1.3.1 | Paper 1.20.1 | Java 17
# Todas las arenas son 1v1. Los ajustes de cada arena se guardan
# en rooms.yml y pueden modificarse desde /srooms roomconfig <room>.
# ================================================================

protection:
  # Cuando allow-build es true, se restauran los cambios al finalizar.
  # El plugin NO duplica los drops al romper; los bloques colocados
  # no se reembolsan a sus propietarios.
  max-edited-blocks: 4096

# Las arenas (incluso vacías) pueden rechazar visitantes que no
# se unieron a un 1v1. Administradores pueden entrar a salas libres.
# Si walk-in está activo, un jugador con srooms.use puede entrar andando.
access:
  protect-empty-rooms: true
  # Usa /srooms setexit para definir un punto seguro fuera de las rooms.
  # exit-spawn: (se guarda automáticamente al ejecutar /srooms setexit)

selection:
  # Protege contra selecciones enormes que puedan generar lag.
  max-zone-volume: 250000
  max-gate-volume: 4096

# Opciones predeterminadas para arenas NUEVAS (las existentes
# conservan sus propios ajustes en rooms.yml).
defaults:
  walk-in: false                   # true = entrar caminando a la región
  block-commands: true             # bloquear comandos durante la partida
  block-ender-pearls: true         # evita escapes por perlas/chorus
  freeze-countdown: true           # no permite moverse antes de PELEA
  duel-duration-seconds: 300       # 30..1800 (5 minutos por defecto)

duel:
  # 0 = sin límite de espera. Una room libre con un solo jugador
  # se cancela automáticamente si no llega rival en este intervalo.
  waiting-timeout-seconds: 120
  gate-material: GLASS             # cristal por defecto; se puede cambiar por room
  bossbar:
    enabled: true                  # barra con cuenta regresiva del combate

ranked:
  # Rating inicial: 1000, factor K configurable para todos los duelos ranked.
  # Ranked debe activarse por room en /srooms roomconfig <room>.
  k-factor: 32

stats:
  enabled: true                    # victorias, derrotas, rachas, top

# Los administradores con srooms.admin siempre pueden usar comandos.
# Los demás solo pueden usar /srooms leave y lo indicado aquí cuando
# una room tiene la opción bloquear comandos activada.
restrictions:
  allowed-commands:
    - "msg"
    - "tell"
    - "w"
    - "r"

announcements:
  broadcast-results: true         # anunciar ganador o empate al servidor
  broadcast-ready: true           # anunciar cuando se reabre una room

sounds:
  enabled: true
  volume: 0.85
  pitch: 1.0
  join: BLOCK_NOTE_BLOCK_PLING
  countdown: BLOCK_NOTE_BLOCK_HAT
  start: ENTITY_ENDER_DRAGON_GROWL
  win: UI_TOAST_CHALLENGE_COMPLETE
  lose: ENTITY_VILLAGER_NO


# Recompensas por ganar (solo cuando la pelea realmente comenzó).
# También debes activar "Recompensa al ganador" en /srooms roomconfig.
# No se ejecutan por empates o partidas canceladas.
# Se ejecutan en consola, así que edita esto solo con permisos de admin.
# Placeholders: %winner%, %loser%, %room%. Máximo 20 comandos.
rewards:
  enabled: false
  winner-commands:
    - "give %winner% diamond 1"

# Kits opcionales por arena. Se crean usando /srooms kit save <room>,
# con todo el inventario y armadura del administrador.
# Activar el kit después en /srooms roomconfig <room>.
# kits.yml guarda el kit. kit-recovery.yml respalda inventarios
# originales mientras un jugador usa un kit.
kits:
  block-containers: true

history:
  # Últimas partidas (victorias y empates) que conserva history.yml.
  max-entries: 200
