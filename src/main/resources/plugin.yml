name: SRooms
version: '1.2.0'
main: dev.srooms.SRoomsPlugin
api-version: '1.20'
author: SRooms
description: Rooms PvP 1v1 con configuracion independiente
commands:
  srooms:
    description: Gestiona y juega en rooms 1v1
    usage: /srooms <help|gui|stats|top|join|leave|list|createroom|roomconfig|reopen|duration|reload>
permissions:
  srooms.use:
    description: Permite jugar en rooms
    default: true
  srooms.admin:
    description: Administra arenas, seleccion y configuracion
    default: op
    children:
      srooms.use: true
